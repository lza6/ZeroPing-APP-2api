<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZeroPing VPN — 节点池 Demo</title>
<style>
:root{--bg:#0b0f17;--card:#141b29;--line:#1f2a3d;--txt:#e6ecf5;--mut:#8a97ab;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--acc:#60a5fa}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;padding:24px;max-width:1200px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
button{background:var(--acc);border:0;color:#06121f;padding:9px 18px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
button.sec{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.stats{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 18px;min-width:120px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;font-size:13px}
th{background:#182236;text-align:left;padding:10px 12px;color:var(--mut);font-weight:600;font-size:12px}
td{padding:10px 12px;border-top:1px solid var(--line)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600}
.pill.ok{background:#123a2c;color:var(--ok)}
.pill.bad{background:#3b1a1e;color:var(--bad)}
.pill.warn{background:#3a2f12;color:var(--warn)}
.mono{font-family:Consolas,monospace;font-size:12px;color:var(--mut)}
#xray{background:#0d1320;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:16px;font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap;color:#9ecbfa;display:none;max-height:340px;overflow:auto}
.flag{font-size:15px}
</style>
</head>
<body>
<h1>🔓 ZeroPing VPN — 节点池收割 Demo</h1>
<div class="sub">逆向来源: APK v0.1.35 b35 · remote_config_defaults.xml AES-256-GCM envelope 已破 · Xray-core VLESS(grpc/ws/reality) 全链路已验证 · catalog inventory-148</div>
<div class="bar">
  <button onclick="load()">🔄 拉取节点池 + 测活</button>
  <button class="sec" onclick="probe()">⚡ 强制重测</button>
  <span id="status" class="mono"></span>
</div>
<div class="stats">
  <div class="stat"><b id="s-total">—</b><span>总节点</span></div>
  <div class="stat"><b id="s-alive" style="color:var(--ok)">—</b><span>VPN 端口存活</span></div>
  <div class="stat"><b id="s-tls" style="color:var(--acc)">—</b><span>TLS 握手通过</span></div>
  <div class="stat"><b id="s-ver">—</b><span>catalog 版本</span></div>
</div>
<table>
<thead><tr><th>ID</th><th>节点</th><th>地址</th><th>协议</th><th>传输</th><th>Ping 端口</th><th>VPN 端口</th><th>TLS</th><th></th></tr></thead>
<tbody id="tb"><tr><td colspan="9" class="mono">点击「拉取节点池」开始…</td></tr></tbody>
</table>
<div id="xray"></div>
<script>
async function load(){await fetchNodes(false)}
async function probe(){await fetchNodes(true)}
async function fetchNodes(force){
  document.getElementById('status').textContent='测活中…';
  try{
    const r=await fetch(force?'/api/probe':'/api/nodes',{method:force?'POST':'GET'});
    const d=await r.json();
    render(d);
  }catch(e){document.getElementById('status').textContent='失败: '+e}
}
function render(d){
  const ns=d.nodes;
  const alive=ns.filter(n=>n.vpn&&n.vpn.open).length;
  const tls=ns.filter(n=>n.tls&&n.tls.ok).length;
  document.getElementById('s-total').textContent=ns.length;
  document.getElementById('s-alive').textContent=alive;
  document.getElementById('s-tls').textContent=tls;
  document.getElementById('s-ver').textContent=(d.catalog_version||'—').split('-').slice(0,2).join('-');
  document.getElementById('status').textContent='完成 '+new Date().toLocaleTimeString();
  const fl={NL:'🇳🇱',US:'🇺🇸',FR:'🇫🇷',RU:'🇷🇺'};
  document.getElementById('tb').innerHTML=ns.map(n=>{
    const vp=n.vpn&&n.vpn.open?`<span class="pill ok">OPEN</span>`:`<span class="pill bad">CLOSED</span>`;
    const pp=n.ping&&n.ping.open?`<span class="pill ok">OPEN</span>`:`<span class="pill warn">—</span>`;
    const tl=n.tls?(n.tls.ok?`<span class="pill ok">${n.tls.proto}</span>`:`<span class="pill bad">${n.tls.err}</span>`):'—';
    const sec=n.security==='reality'?'<span class="pill warn">REALITY</span>':'';
    return `<tr><td class="mono">${n.id}</td><td><span class="flag">${fl[n.country]||''}</span> ${n.name}</td>
    <td class="mono">${n.address}:${n.port}</td><td>vless</td><td>${n.network}${sec}</td><td>${pp}</td><td>${vp}</td><td>${tl}</td>
    <td><button class="sec" onclick="showXray('${n.id}')">config</button></td></tr>`;
  }).join('');
}
async function showXray(id){
  const r=await fetch('/api/xray/'+id); const d=await r.json();
  const el=document.getElementById('xray');
  el.style.display='block'; el.textContent=JSON.stringify(d,null,2);
}
</script>
</body>
</html>
